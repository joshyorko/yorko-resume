# Project Information
site_name: 'Joshua Yorko — Resume'
site_description: 'Software Engineer'
site_author: 'Joshua Yorko'
site_url: 'https://joshyorko.github.io'
repo_url: 'https://github.com/joshyorko/yorko-resume'
repo_name: 'yorko-resume'
edit_uri: 'edit/main/docs/'

# Navigation Configuration
nav:
  - Home: 'index.md'

# Theme Configuration
theme:
  name: 'material'
  custom_dir: overrides
  logo: 'assets/images/logo.png'
  favicon: 'assets/images/favicon.ico'

  features:
    # Navigation & structure
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.instant
    # Content UX
    - content.code.annotate
    - content.code.copy
    - content.action.edit
    - content.action.view
    - content.tabs.link
    # Search & performance
    - search.suggest
    - search.highlight
    - search.share
    # Other
    - toc.follow

  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  font:
    text: 'Roboto'
    code: 'Roboto Mono'

  icon:
    repo: fontawesome/brands/github
  
# Plugin Configuration
plugins:
  - search
  - minify:
      minify_html: true
  - git-revision-date-localized:
      type: timeago
  - glightbox
  # - social  # Uncomment if social cards plugin added to dependencies

# Markdown Extensions
markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 3
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.critic
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.magiclink
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.highlight:
      anchor_linenums: true
      linenums: true
  - codehilite:
      guess_lang: false
  - footnotes
  - meta
  - nl2br
  - sane_lists
  - smarty

# Extra configuration
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/joshyorko
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/joshua-yorko-560103a9/
      name: LinkedIn
  generator: false

copyright: "© 2025 Joshua Yorko. All rights reserved."

# To enable Google Analytics, add:
# google_analytics:
#   - 'G-XXXXXXXXXX'
#   - 'auto'
