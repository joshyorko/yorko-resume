name: Verify LaTeX résumé candidates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  red-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare PDF tools
        run: |
          python -m pip install pypdf==6.4.2
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Reproduce the red review PDF
        run: |
          source=portfolio/resume/review/awesome-cv-confirmed.pdf
          out="$RUNNER_TEMP/red-resume-review"
          mkdir -p "$out"
          git show b536bd686d74829751a04cb860f4e494caaa5a85:portfolio/resume/JoshuaYorko-Resume.pdf > "$RUNNER_TEMP/approved-T.pdf"
          python portfolio/resume/restore-red-text.py "$source" "$out/red-review.pdf" --approved "$RUNNER_TEMP/approved-T.pdf"
          cmp portfolio/resume/JoshuaYorko-Resume.pdf "$out/red-review.pdf"
          pdftoppm -r 150 -png "$source" "$RUNNER_TEMP/confirmed"
          pdftoppm -r 150 -png "$out/red-review.pdf" "$out/red-review"
          for page in 1 2; do
            cmp "$RUNNER_TEMP/confirmed-$page.png" "$out/red-review-$page.png"
          done
          (cd "$out" && sha256sum red-review.pdf > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: red-resume-review
          path: ${{ runner.temp }}/red-resume-review/
          if-no-files-found: error

  candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare review toolchain
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL 'https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz' -o tectonic.tar.gz
          echo '8533d07f9ccbd7a65824b9e0459041bca34af1eb33daba48f59215593753a3b7  tectonic.tar.gz' | sha256sum -c
          tar xzf tectonic.tar.gz tectonic
          python -m pip install pypdf==6.4.2 pdfminer.six==20250506 Pillow==12.2.0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Render and verify
        shell: bash
        env:
          TECTONIC: ${{ runner.temp }}/tectonic
        run: |
          out="$RUNNER_TEMP/resume-review"
          mkdir -p "$out"
          node portfolio/resume/candidates.mjs "$out" > "$out/latex-build.log" 2>&1
          python portfolio/resume/verify-candidates.py "$out" | tee "$out/verification.txt"
          node portfolio/resume/candidates.mjs "$RUNNER_TEMP/resume-repeat" > "$RUNNER_TEMP/resume-repeat.log" 2>&1
          for candidate in A B C H R S T; do
            cmp "$out/$candidate.pdf" "$RUNNER_TEMP/resume-repeat/$candidate.pdf"
          done
          echo 'Seven byte-identical repeat builds' | tee -a "$out/verification.txt"
          python portfolio/resume/render-review.py "$out"
          cp portfolio/resume/DESIGN-REVIEW.md "$out/"
          cp portfolio/resume/HIRING-REVIEW.md "$out/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resume-review-only
          path: |
            ${{ runner.temp }}/resume-review/*.pdf
            ${{ runner.temp }}/resume-review/*.png
            ${{ runner.temp }}/resume-review/latex-build.log
            ${{ runner.temp }}/resume-review/verification.txt
            ${{ runner.temp }}/resume-review/DESIGN-REVIEW.md
            ${{ runner.temp }}/resume-review/HIRING-REVIEW.md
