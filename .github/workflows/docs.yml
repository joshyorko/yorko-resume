name: GitHub Pages compatibility

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node portfolio/compat/build.mjs "$RUNNER_TEMP/pages"
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages-compatibility
          path: ${{ runner.temp }}/pages
          include-hidden-files: true

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: github-pages-compatibility
    concurrency: github-pages-compatibility
    steps:
      - name: Confirm operator enablement
        env:
          ENABLED: ${{ vars.PAGES_COMPATIBILITY_PUBLISH_ENABLED }}
        run: test "$ENABLED" = true
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: github-pages-compatibility
          path: ${{ runner.temp }}/pages
      - uses: peaceiris/actions-gh-pages@v3
        with:
          deploy_key: ${{ secrets.PAGES_COMPATIBILITY_DEPLOY_KEY }}
          publish_dir: ${{ runner.temp }}/pages
          publish_branch: gh-pages
      - name: Verify published homepage and résumé
        run: node portfolio/compat/check-live.mjs "$RUNNER_TEMP/pages"
