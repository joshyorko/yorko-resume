name: Build & Deploy Docs

on:
  workflow_dispatch:

  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build docs with the approved résumé
        run: |
          python -m pip install mkdocs==1.5.3 mkdocs-material==9.4.6 mkdocs-minify-plugin==0.7.1 mkdocs-git-revision-date-localized-plugin==1.2.1 mkdocs-glightbox==0.3.4 pymdown-extensions==10.8
          cmp docs/assets/JoshYorkoResume.pdf portfolio/resume/JoshuaYorko-Resume.pdf
          mkdocs build --strict
          cmp docs/assets/JoshYorkoResume.pdf site/assets/JoshYorkoResume.pdf

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
