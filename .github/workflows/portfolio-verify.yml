name: Verify portfolio

on:
  push:
    branches: [main, preview-v2]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio/package-lock.json
      - run: npm ci
      - run: npm run verify
        env:
          PROOF_DIR: ${{ runner.temp }}/portfolio-proof
      - name: Verify packaged Worker
        run: |
          for mode in preview production; do
            flags=()
            if [[ "$mode" == production ]]; then flags=(--production); fi
            node preview-pack.mjs "$GITHUB_SHA" "${flags[@]}" > "$RUNNER_TEMP/$mode.mjs"
            node release/check-worker.mjs "$RUNNER_TEMP/$mode.mjs" "$GITHUB_SHA" "$mode"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-proof
          path: ${{ runner.temp }}/portfolio-proof/
